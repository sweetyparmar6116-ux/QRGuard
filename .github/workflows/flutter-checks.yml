name: Flutter checks and Android APK
on:
  push:
    branches: [main, qrguard-usability-update]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload QRGuard APK
        uses: actions/upload-artifact@v4
        with:
          name: QRGuard-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
